name: Deploy Kasitronik to CloudPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy to CloudPanel
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Code
        run: pnpm run lint

      - name: Build Next.js App
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_GEOAPIFY_MAPS_KEY: ${{ secrets.NEXT_PUBLIC_GEOAPIFY_MAPS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: pnpm run build

      - name: Compress Build Artifacts
        run: tar -czf build.tar.gz .next public package.json pnpm-lock.yaml next.config.*

      - name: Transfer Build to CloudPanel Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "build.tar.gz"
          target: ${{ secrets.TARGET_DIR }}

      - name: Extract, Sync Env & Reload PM2 on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 5m
          envs: NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_GEOAPIFY_MAPS_KEY,GEMINI_API_KEY,GEMINI_MODEL,GEOAPIFY_API_KEY
          script: |
            set -e
            export CI=true

            cd ${{ secrets.TARGET_DIR }}

            echo "==> Extracting new build"
            rm -rf .next
            tar --no-same-owner --no-same-permissions --touch -xzf build.tar.gz
            rm -f build.tar.gz

            echo "==> Updating .env file"
            cat << 'EOF' > .env
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_GEOAPIFY_MAPS_KEY=${{ secrets.NEXT_PUBLIC_GEOAPIFY_MAPS_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            GEMINI_MODEL=${{ secrets.GEMINI_MODEL }}
            GEOAPIFY_API_KEY=${{ secrets.GEOAPIFY_API_KEY }}
            EOF

            echo "==> Checking pnpm & installing production dependencies"
            export PNPM_HOME="$HOME/.local/share/pnpm"
            NODE_BIN="$HOME/.nvm/versions/node/$(ls -1 $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin"
            export PATH="$PNPM_HOME:$NODE_BIN:$PATH"

            if pnpm --version &> /dev/null; then
              PNPM="pnpm"
            elif [ -x "$HOME/.local/share/pnpm/pnpm" ]; then
              PNPM="$HOME/.local/share/pnpm/pnpm"
            else
              PNPM="npx --yes pnpm"
            fi

            $PNPM install --prod --frozen-lockfile

            echo "==> Reloading Kasitronik on PM2"
            if command -v pm2 &> /dev/null; then
              if pm2 describe kasitronik > /dev/null 2>&1; then
                pm2 reload kasitronik --update-env
              else
                pm2 start "$PNPM" --name "kasitronik" -- start
                pm2 save
              fi
            fi

            echo "==> Deployment Kasitronik ke CloudPanel Berhasil!"