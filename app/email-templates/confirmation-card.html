<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konfirmasi Email Kasitronik</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background-color:#faf9f7;font-family:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#1c2621;-webkit-font-smoothing:antialiased;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#faf9f7;">
    <tr>
      <td align="center" style="padding:24px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:480px;background-color:#ffffff;border:1px solid #e1e7de;border-radius:16px;">
          <tr>
            <td style="padding:32px;font-family:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;">
              <!-- Brand -->
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin-bottom:24px;">
                <tr>
                  <td valign="middle" style="padding-right:10px;">
                    <img src="https://kasitronik.ourprojects.my.id/logo.png" width="28" height="28" alt="Kasitronik" style="display:block;border:0;width:28px;height:28px;">
                  </td>
                  <td valign="middle" style="font-family:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:18px;font-weight:600;letter-spacing:-0.02em;color:#1c2621;">
                    Kasitronik
                  </td>
                </tr>
              </table>

              <!-- Heading -->
              <h1 style="margin:0 0 12px 0;font-family:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:24px;font-weight:600;line-height:1.25;letter-spacing:-0.03em;color:#1c2621;">
                Konfirmasi email Anda
              </h1>

              <!-- Body -->
              <p style="margin:0 0 24px 0;font-family:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:15px;font-weight:400;line-height:1.6;color:#59665d;">
                Klik tombol di bawah untuk mengaktifkan akun Kasitronik Anda.
              </p>

              <!-- Primary Pill Button -->
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td align="center">
                    <a href="{{ .ConfirmationURL }}" target="_blank" style="display:block;width:100%;box-sizing:border-box;background-color:#046645;color:#ffffff;font-family:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:15px;font-weight:600;line-height:1.4;text-align:center;text-decoration:none;padding:14px 24px;border-radius:48px;">
                      Aktifkan akun
                    </a>
                  </td>
                </tr>
              </table>

              <!-- Divider -->
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin:24px 0 16px 0;">
                <tr>
                  <td style="height:1px;background-color:#e1e7de;font-size:0;line-height:0;">&nbsp;</td>
                </tr>
              </table>

              <!-- Footer -->
              <p style="margin:0;font-family:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:12px;line-height:1.6;color:#59665d;">
                Tombol tidak berfungsi? <a href="{{ .ConfirmationURL }}" target="_blank" style="color:#046645;text-decoration:underline;">Buka tautan verifikasi</a><br>
                &copy; Kasitronik
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
